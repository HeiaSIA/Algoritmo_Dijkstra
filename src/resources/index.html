<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ALGORITMO DE DIJKSTRA</title>
    <style>
        body {
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            text-align: center;
            background: #0d0f12;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }
        #controles { margin-bottom: 25px; }
        button {
            padding: 10px 18px;
            margin: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #ffffff;
            background: transparent;
            color: #ffffff;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        button:hover {
            background: rgba(0, 242, 254, 0.1);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
        #btnEditar {
            border-color: #ffaa00;
            color: #ffaa00;
        }
        #btnEditar:hover {
            background: rgba(255, 170, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
        }
        #btnDijkstra {
            border-color: #39ff14;
            color: #39ff14;
        }
        #btnDijkstra:hover {
            background: rgba(57, 255, 20, 0.1);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        #canvasGrafo {
            background: #141820;
            border: 1px solid #232d3f;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        #consola {
            width: 600px;
            height: 120px;
            margin: 20px auto;
            background: #141820;
            color: #ffffff;
            border: 1px solid #232d3f;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            text-align: left;
            overflow-y: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h1>ALGORITMO DE DIJKSTRA :)</h1>

<div id="controles">
    <button onclick="cambiarModo('nodo')">Nodo (+)</button>
    <button onclick="cambiarModo('arista')">Arista (↔)</button>
    <button id="btnEditar" onclick="cambiarModo('editar')">Editar Peso (✎)</button>
    <button onclick="eliminarUltimo()">Eliminar Último</button>
    <button id="btnDijkstra" onclick="ejecutarDijkstra()">Calcular Dijkstra</button>
</div>

<canvas id="canvasGrafo" width="600" height="400"></canvas>
<div id="consola">>>> Conectando con el servidor...</div>

<script>
    const canvas = document.getElementById('canvasGrafo');
    const ctx = canvas.getContext('2d');
    const consola = document.getElementById('consola');

    let estado = { nodos: [], aristas: [], modo: 'nodo', nodoSeleccionado: null, rutaResaltada: [], logs: [] };

    async function sincronizarUI(json) {
        estado = json;

        consola.innerHTML = estado.logs.map(l => "> " + l).join("<br>");
        consola.scrollTop = consola.scrollHeight;

        if (estado.alert) {
            alert(estado.alert);
        }

        // Caso 1: Crear arista nueva
        if (estado.solicitarArista) {
            let pesoInput = prompt("Introduce el peso de la arista:", "5");
            let peso = parseInt(pesoInput);
            if (!isNaN(peso) && peso >= 0) {
                await enviarAccion(`addArista&desde=${estado.solicitarArista.desde}&hasta=${estado.solicitarArista.hasta}&peso=${peso}`);
            } else if (pesoInput !== null) {
                alert("Por favor introduce un peso numérico válido.");
            }
        }

        // Caso 2: Editar arista existente
        if (estado.solicitarEdicionArista) {
            let pesoInput = prompt(`Introduce el nuevo peso para la arista (Actual: ${estado.solicitarEdicionArista.actual}):`, estado.solicitarEdicionArista.actual);
            let peso = parseInt(pesoInput);
            if (!isNaN(peso) && peso >= 0) {
                await enviarAccion(`actualizarPeso&desde=${estado.solicitarEdicionArista.desde}&hasta=${estado.solicitarEdicionArista.hasta}&peso=${peso}`);
            } else if (pesoInput !== null) {
                alert("Por favor introduce un peso numérico válido.");
            }
        }

        dibujar();
    }

    async function enviarAccion(queryString) {
        const res = await fetch(`/api?action=${queryString}`, { method: 'POST' });
        const json = await res.json();
        await sincronizarUI(json);
    }

    function cambiarModo(nuevoModo) {
        enviarAccion(`cambiarModo&modo=${nuevoModo}`);
    }

    if (estado.modo === 'editar') {
        ctx.fillStyle = "rgba(255, 170, 0, 0.2)";
        ctx.arc(midX, midY, 12, 0, 2 * Math.PI);
        ctx.fill();
    }

    function eliminarUltimo() {
        enviarAccion('eliminar');
    }

    function ejecutarDijkstra() {
        if (estado.nodos.length < 2) {
            alert("¡Necesitas crear al menos 2 nodos y conectarlos!");
            return;
        }
        let origenInput = prompt("Introduce el ID del nodo de ORIGEN:", "0");
        if (origenInput === null) return;
        let origen = parseInt(origenInput);

        let destinoInput = prompt("Introduce el ID del nodo de DESTINO:", (estado.nodos.length - 1).toString());
        if (destinoInput === null) return;
        let destino = parseInt(destinoInput);

        enviarAccion(`dijkstra&origen=${origen}&destino=${destino}`);
    }

    canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        enviarAccion(`click&x=${x}&y=${y}`);
    });

    function dibujar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Aristas
        estado.aristas.forEach(arista => {
            let n1 = estado.nodos.find(n => n.id === arista.desde);
            let n2 = estado.nodos.find(n => n.id === arista.hasta);
            if (n1 && n2) {
                let esParteDeRuta = estado.rutaResaltada.some(r =>
                    (r.de === arista.desde && r.a === arista.hasta) ||
                    (r.de === arista.hasta && r.a === arista.desde)
                );

                let midX = (n1.x + n2.x) / 2;
                let midY = (n1.y + n2.y) / 2;

                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);

                ctx.strokeStyle = esParteDeRuta ? "#39ff14" : "#2d3748";
                ctx.lineWidth = esParteDeRuta ? 4 : 1.5;
                ctx.stroke();

                // Si está en modo edición de pesos, dibuja un pequeño indicador circular ámbar detrás del número
                if (estado.modo === 'editar') {
                    ctx.beginPath();
                    ctx.arc(midX, midY - 4, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = "rgba(255, 170, 0, 0.15)";
                    ctx.fill();
                }

                ctx.fillStyle = esParteDeRuta ? "#39ff14" : (estado.modo === 'editar' ? "#ffaa00" : "#a0aec0");
                ctx.font = esParteDeRuta ? "bold 13px Consolas" : "11px Consolas";
                ctx.textAlign = "center";
                ctx.fillText(arista.peso, midX, midY - 1);
            }
        });

        // Nodos
        estado.nodos.forEach(nodo => {
            ctx.beginPath();
            ctx.arc(nodo.x, nodo.y, 16, 0, 2 * Math.PI);

            if (nodo.id === estado.nodoSeleccionado) {
                ctx.fillStyle = "#ff007f";
            } else {
                ctx.fillStyle = "#00f2fe";
            }
            ctx.fill();

            ctx.lineWidth = 1;
            ctx.strokeStyle = "#0d0f12";
            ctx.stroke();

            ctx.fillStyle = "#0d0f12";
            ctx.font = "bold 12px Consolas";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(nodo.id, nodo.x, nodo.y);
        });
    }

    window.onload = () => enviarAccion('get');
</script>
</body>
</html>
